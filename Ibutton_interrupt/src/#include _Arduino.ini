#include <Arduino.h>

/*
Emulate ibutton slave. interface with DS2482-800.
Wait for reset
Send presence
Wait for presence-end (line returns HIGH)
Wait for first falling edge → start of slot
Wait the sample time
Read level
Return to WAIT_FOR_START_BIT

RESET → PRESENCE
    ↓
CMD READ (0x33)
    ↓
romReadActive = true
    ↓
DS2482 issues 64 falling edges (read slots)
    ↓ (ISR)
ESP32 outputs each ROM bit at each falling edge
    ↓
64 bits sent → romReadActive = false
──────────────────────────────────────────────
LAST BIT OF 0x33 COMMAND (WRITE-1)
──────────────────────────────────────────────
t = 0 µs     DS2482 pulls LOW (~6 µs)
t = 6 µs     DS2482 releases → HIGH (for rest of 60 µs slot)

──────────────────────────────────────────────
RECOVERY / GAP
──────────────────────────────────────────────
t = 60–70 µs  line stays HIGH (tREC)

──────────────────────────────────────────────
FIRST READ SLOT
──────────────────────────────────────────────
t = 70 µs     DS2482 pulls LOW (start read slot)
t = 76 µs     DS2482 releases → HIGH
              • Slave bit window opens
              • iButton may pull LOW (bit=0) or leave HIGH (bit=1)

t = 85 µs     DS2482 samples the bit (≈15 µs sample point)

t = 130 µs    Read slot ends (60 µs total)
Slot 1:
0–8 µs    : Master pulls line low (start of slot 1)
8–65 µs   : Line high / slave may pull low for '0'
12–15 µs  : Master samples line
65 µs     : End of slot 1

Slot 2:
65–73 µs  : Master pulls line low (start of slot 2)
73–130 µs : Line high / slave may pull low for '0'
77–80 µs  : Master samples line
130 µs    : End of slot 2

*/

// Example 8-byte iButton ROM (64-bit address)
constexpr uint8_t iButtonROMs[8][8] = {
    { 0x01,0xA0,0xB2,0xC3,0xD4,0xE5,0xF6,0x00 },
    { 0x01,0x11,0x22,0x33,0x44,0x55,0x66,0x77 },
    { 0x01,0x10,0x20,0x30,0x40,0x50,0x60,0x70 },
    { 0x01,0xAA,0xBB,0xCC,0xDD,0xEE,0xFF,0x99 },
    { 0x01,0x02,0x03,0x04,0x05,0x06,0x07,0x08 },
    { 0x01,0x90,0x91,0x92,0x93,0x94,0x95,0x96 },
    { 0x01,0xDE,0xAD,0xBE,0xEF,0x00,0x00,0x01 },
    { 0x01,0x55,0x55,0x55,0x55,0x55,0x55,0x55 }
};

hw_timer_t *romTimer = nullptr;
portMUX_TYPE timerMux = portMUX_INITIALIZER_UNLOCKED;

constexpr uint8_t oneWirePins[8] = {4, 5, 18, 19, 21, 22, 23, 25};
constexpr int NumPins = 1;

// 1-Wire timing constants (µs)
constexpr uint16_t T_RESET_MIN         = 480;
constexpr uint16_t T_RESET_MAX         = 960;
constexpr uint16_t T_READ_MIN          = 4; // Read pluse from master normally 6 u sec
constexpr uint16_t T_READ_START        = 8;  // Wait 8 usec then take the line down to start 
constexpr uint16_t T_READ_A_ZERO       = 5;  // Wait 5 usec before taking line low for a zero 
constexpr uint16_t T_READ_MAX          = 12;
constexpr uint16_t T_PRESENCE_DELAY    = 30;
constexpr uint16_t T_PRESENCE_DURATION = 120;
constexpr uint16_t T_READ_BIT_DURATION = 50;
constexpr uint16_t T_BIT_SAMPLE        = 15;  // typical 15 usec sample after falling edge


struct Edge {
    uint32_t time;
    bool level;  // 0=LOW, 1=HIGH
};

struct OneWirePin {
    enum State { IDLE, RESET_DETECTED, PRESENCE_PULSE, PRESENCE_PULSE_START, 
                COMMAND_READING, COMMAND_READY, READ_ROM, READ_IDLE, READ_DETECTED} state = IDLE;

    // Circular buffer for edges
    static constexpr int MAX_EDGES = 128;  // safest
    volatile Edge edgeQueue[MAX_EDGES];
    volatile int head = 0;
    volatile int tail = 0;

    // Reset detection
    uint32_t resetFalling = 0;
    uint32_t resetRising  = 0;

    // Presence pulse
    uint32_t presenceStart = 0;
    // Read Pulse
      uint32_t readStart = 0;
    // Read Bit will be set for 0
      bool bitIsZero = 0;
    // Command reading
    uint8_t command = 0;
    int bitIndex = 0;
    uint32_t lastBitTime = 0;
    bool commandReady = false;
    bool readLowReceive = false;
    bool WriteLowReceive = false;
    bool readDetect = false;
    uint8_t romByte = 0;
    uint8_t romByteIndex = 0;
    uint8_t romBitIndex = 0;
    bool romActive = false;    // <--- add this
    bool pulseLow = false;     // <--- add this to track if current bit should pull LOW
};

OneWirePin oneWire[NumPins];

// -------------------- ISR --------------------
void IRAM_ATTR recordEdge(int index, bool level) {
    auto &pin = oneWire[index];
    int nextHead = (pin.head + 1) % OneWirePin::MAX_EDGES;
    if (nextHead != pin.tail) { // prevent overflow
        pin.edgeQueue[pin.head].time  = micros();
        pin.edgeQueue[pin.head].level = level;
        pin.head = nextHead;
    }
}

void IRAM_ATTR oneWireISR(int index) {
    int level = gpio_get_level((gpio_num_t)oneWirePins[index]);
    recordEdge(index, level);
}

volatile int debugTick = 0;

void IRAM_ATTR onROMTimer() {
    debugTick++;

    portENTER_CRITICAL_ISR(&timerMux);
    auto &pin = oneWire[0];

    if (!pin.romActive) {
        portEXIT_CRITICAL_ISR(&timerMux);
        return;
    }

    // Drive line
    gpio_set_level((gpio_num_t)oneWirePins[0], pin.pulseLow ? LOW : HIGH);

    if (pin.pulseLow) {
        // Finished pulling LOW, schedule release
        pin.pulseLow = false;
        timerWrite(romTimer, 0);
        timerAlarmWrite(romTimer, T_READ_BIT_DURATION - T_READ_START, false);
        timerAlarmEnable(romTimer);
    } else {
        // Move to next bit
        pin.romBitIndex++;
        if (pin.romBitIndex >= 8) {
            pin.romBitIndex = 0;
            pin.romByteIndex++;
            if (pin.romByteIndex < 8) {
                pin.romByte = iButtonROMs[0][pin.romByteIndex];
            } else {
                // Finished ROM
                pin.romActive = false;
                gpio_set_level((gpio_num_t)oneWirePins[0], HIGH);
                portEXIT_CRITICAL_ISR(&timerMux);
                return;
            }
        }

        // Schedule next bit
        uint8_t bit = (pin.romByte >> pin.romBitIndex) & 1;
        pin.pulseLow = (bit == 0);
        timerWrite(romTimer, 0);
        timerAlarmWrite(romTimer, pin.pulseLow ? T_READ_START : T_READ_BIT_DURATION, false);
        timerAlarmEnable(romTimer);
    }

    portEXIT_CRITICAL_ISR(&timerMux);
}


// ISR table
void IRAM_ATTR ISR0() { oneWireISR(0); }
void IRAM_ATTR ISR1() { oneWireISR(1); }
void IRAM_ATTR ISR2() { oneWireISR(2); }
void IRAM_ATTR ISR3() { oneWireISR(3); }
void IRAM_ATTR ISR4() { oneWireISR(4); }
void IRAM_ATTR ISR5() { oneWireISR(5); }
void IRAM_ATTR ISR6() { oneWireISR(6); }
void IRAM_ATTR ISR7() { oneWireISR(7); }

typedef void (*isrFunc)();
isrFunc ISR_Table[8] = { ISR0, ISR1, ISR2, ISR3, ISR4, ISR5, ISR6, ISR7 };

// -------------------- Setup --------------------
void setup() {
    Serial.begin(115200);
    while (!Serial);

    for (int i = 0; i < NumPins; i++) {
         pinMode(oneWirePins[i], OUTPUT_OPEN_DRAIN);
         gpio_set_level((gpio_num_t)oneWirePins[i], HIGH);
        attachInterrupt(digitalPinToInterrupt(oneWirePins[i]), ISR_Table[i], CHANGE);
    }
        romTimer = timerBegin(1, 80, true); // 1µs tick
        timerAttachInterrupt(romTimer, &onROMTimer, true);

    Serial.println("1-Wire non-blocking emulator setup done.");
}


//---------------------Process command received --------------
void commandReceived(int index){
   
    auto &pin = oneWire[index];
       if (pin.commandReady){
                 uint8_t cmd = pin.command;
  //              Serial.printf("Command received on pin %d: 0x%02X\n", index, cmd);
                  Edge e;
                    e.time  = pin.edgeQueue[pin.tail].time;
                    e.level = pin.edgeQueue[pin.tail].level; 

                pin.commandReady = false;

                switch (cmd) {

                case 0x33:  // READ ROM
                    pin.state = OneWirePin::READ_ROM;
                    pin.romByteIndex = 0;
                    pin.romBitIndex  = 0;
                    pin.romByte      = iButtonROMs[index][0];
                    pin.pulseLow     = ((pin.romByte >> 0) & 1) == 0;
                    pin.romActive    = true;   // <-- start timer ISR immediately
                    timerWrite(romTimer, 0);
                    timerAlarmWrite(romTimer, pin.pulseLow ? T_READ_START : T_READ_BIT_DURATION, false);
                    timerAlarmEnable(romTimer);
                    Serial.printf("Pin %d: Received 0x33 command\n", index);
                    break;


                    case 0x55:  // ---------- MATCH ROM ----------
                        Serial.printf("Pin %d: MATCH-ROM not implemented yet\n", index);
                         pin.state = OneWirePin::IDLE;
                        break;

                    case 0xF0:  // ---------- SEARCH ROM ----------
                        Serial.printf("Pin %d: SEARCH-ROM not implemented yet\n", index);
                        pin.state = OneWirePin::IDLE;
                        break;

                    default:
                        Serial.printf("Pin %d: Unsupported command 0x%02X\n", index, cmd);
                         pin.state = OneWirePin::IDLE;
                        break;
                }

                pin.command = 0;
                pin.bitIndex = 0;

            }
}

int count =0;

// -------------------- Process edges per pin --------------------
void processEdges(int index) {
    auto &pin = oneWire[index];

    while (pin.tail != pin.head) {
        // Copy fields manually (fix volatile issue)
        Edge e;
        e.time  = pin.edgeQueue[pin.tail].time;
        e.level = pin.edgeQueue[pin.tail].level;

        pin.tail = (pin.tail + 1) % OneWirePin::MAX_EDGES;

        switch (pin.state) {
            case OneWirePin::IDLE:
                if (!e.level) { // falling edge => possible reset
                    pin.resetFalling = e.time;
                    pin.state = OneWirePin::RESET_DETECTED;
                }
                break;

            case OneWirePin::RESET_DETECTED:
                if (e.level) { // rising edge => end of reset or read pulse
                    pin.resetRising = e.time;
                    uint32_t width = pin.resetRising - pin.resetFalling;
                    if (width >= T_RESET_MIN && width <= T_RESET_MAX) {
                    Serial.printf("Reset pulse detected on pin %d: %u us dedug %i\n", index, width, debugTick);
                        pin.presenceStart = e.time;
                        pin.state = OneWirePin::PRESENCE_PULSE;
                    } else {
                      pin.state = OneWirePin::IDLE; // ignore false reset
                    }
                }
                break;

            case OneWirePin::READ_IDLE:
                if (!e.level) { // falling edge => possible reset
                    pin.readStart = e.time;
                    pin.state = OneWirePin::READ_DETECTED;
                }

                break;
        
            case OneWirePin::READ_DETECTED:
                if (e.level) { // rising edge => end of read pulse
                    pin.resetRising = e.time;
                    uint32_t width = pin.resetRising - pin.readStart;

                    if (width >= T_READ_MIN && width <= T_READ_MAX) {
                        // Timestamp is rising-edge (start of bit window)
                        pin.readStart = pin.resetRising;

                        // Determine ROM bit
                        uint8_t bit = (pin.romByte >> pin.romBitIndex) & 1;

                        // Mark whether to pull low (0 bit) in timer ISR
                        pin.pulseLow = (bit == 0);

                        // Advance ROM bit index
                        pin.romBitIndex++;
                        if (pin.romBitIndex >= 8) {
                            pin.romBitIndex = 0;
                            pin.romByteIndex++;
                            if (pin.romByteIndex < 8) {
                                pin.romByte = iButtonROMs[index][pin.romByteIndex];
                            } else {
                                // Finished sending full ROM
                                pin.romActive = false;
                                gpio_set_level((gpio_num_t)oneWirePins[index], HIGH);
                                pin.state = OneWirePin::IDLE;
                                break;
                            }
                        }

                        // Activate timer ISR if not already active
                        if (!pin.romActive) {
                            pin.romActive = true;
                            timerWrite(romTimer, 0);
                            timerAlarmWrite(romTimer, pin.pulseLow ? T_READ_START : T_READ_BIT_DURATION, false);
                            timerAlarmEnable(romTimer);
                        }

                        pin.state = OneWirePin::READ_IDLE;

                    } else {
                        Serial.printf("Read Detect pulse overrun %u us\n", width);
                        pin.state = OneWirePin::IDLE;
                    }
                }
            break;
                /*
            case OneWirePin::READ_DETECTED:
                if (e.level) { // rising edge => end of read pulse
                    pin.resetRising = e.time;
                    uint32_t width = pin.resetRising - pin.readStart;

                    if (width >= T_READ_MIN && width <= T_READ_MAX) {
                        
      //                Serial.printf("Read pulse detected on pin %d: %u us\n", index, width);
                        pin.readDetect = true;
                        // Timestamp is rising-edge (start of bit window)
                        pin.readStart = pin.resetRising;
                        count++;
                        // Determine ROM bit
                        uint8_t bit = (pin.romByte >> pin.romBitIndex) & 1;

                        // Mark whether to pull low later
                        pin.bitIsZero = (bit == 0);

                        // Advance ROM bit index
                        pin.romBitIndex++;
                        if (pin.romBitIndex >= 8) {
                            pin.romBitIndex = 0;
                            pin.romByteIndex++;
                            if (pin.romByteIndex < 8) {
                                pin.romByte = iButtonROMs[index][pin.romByteIndex];
                            } else {
                                Serial.printf("Sent rom on pin %d\n", index);
                                pin.state = OneWirePin::IDLE;
                                break;
                            }
                        }

                        // Always return to READ_IDLE; loop() handles output timing
                        pin.state = OneWirePin::READ_ROM;

                    } else {
                        Serial.printf("Read Detect pulse over run%i\n",width);
                        pin.state = OneWirePin::IDLE;
                    }
                }
                break;
*/
            case OneWirePin::PRESENCE_PULSE_START:
                  // Instead of immediately driving presence or reading, wait for first falling edge
                if (e.level) { // HIGH = end of presence pulse
                    pin.command = 0;
                    pin.bitIndex = 0;
                    pin.state = OneWirePin::COMMAND_READING;
                }
            break;   

            case OneWirePin::COMMAND_READING: 
                  if (!pin.readLowReceive){
                    if (!e.level) { // falling edge = first bit start
                       pin.lastBitTime = e.time;  
                         pin.readLowReceive = true; 
                     } 
                   } 
            break;

            default: break;
        }
    }
}

// -------------------- Main loop --------------------
void loop() {
    uint32_t now = micros();

    for (int i = 0; i < NumPins; i++) {
        auto &pin = oneWire[i];
       
        processEdges(i);        // Process all queued edges

        // Presence pulse
        if (pin.state == OneWirePin::PRESENCE_PULSE) {
            if (now - pin.presenceStart >= T_PRESENCE_DELAY) {
                gpio_set_level((gpio_num_t)oneWirePins[i], LOW);
                pin.presenceStart = now;
                pin.state = OneWirePin::PRESENCE_PULSE_START;
            }            
        }

        if (pin.state == OneWirePin::PRESENCE_PULSE_START) {
           if (now - pin.presenceStart >= T_PRESENCE_DURATION) {
                 gpio_set_level((gpio_num_t)oneWirePins[i], HIGH);// release line
                   pin.presenceStart = now; // ready for next bits
           }
        }
        
        if (pin.state == OneWirePin::COMMAND_READING) {
          if (pin.readLowReceive){
            if ((micros() - pin.lastBitTime) >= T_BIT_SAMPLE){
                                       // Read line level safely
                        int level = gpio_get_level((gpio_num_t)oneWirePins[i]);
                        bool bit = (level != 0); // HIGH = 1, LOW = 0

                       // Store bit
                        pin.command |= (bit << pin.bitIndex);
                        pin.bitIndex++;

                        // Done with byte?
                        if (pin.bitIndex >= 8) {  
                            pin.commandReady = true;
                            commandReceived(i);
                            // let ISR handle bits
                        }
             pin.readLowReceive = false;           
            }
          }
        }
